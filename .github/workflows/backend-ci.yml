name: Backend CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: optiguide_test
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: optiguide_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint check (Ruff)
        run: ruff check .

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://optiguide_test:testpassword123@localhost:5432/optiguide_test_db
        run: alembic upgrade head

      - name: Run Pytest suite
        env:
          DATABASE_URL: sqlite:///./test.db
          APP_ENV: test
          LOG_LEVEL: WARNING
        run: pytest tests/ -v
